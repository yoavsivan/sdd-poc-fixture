# gatekit verification contract — F1 (2026-09-06)
# Grammar: docs/contract-format.md. Every check must pass for `gatekit done --feature F1`.
feature: F1
base: 7dc3d08df3e41807b1b575b738e8afb5f7990b93

# Empty so a single-agent flow can finish; plan-review and code-review are still written and checked.
required_gates:

checks:
  - id: plan-has-handoff
    kind: spec-mentions
    file: plan.md
    terms:
      - "## Hand-off"

  - id: tasks-complete
    kind: command
    run: gatekit tasks --feature F1

  - id: brief-names-surface
    kind: spec-mentions
    file: brief.md
    terms:
      - GET /api/items
      - POST /api-keys
      - POST /api-keys/:id/revoke
      - api-keys-section
      - api-key-name
      - api-key-create
      - api-key-plaintext
      - api-key-row
      - api-key-created
      - api-key-last-used
      - api-key-revoke
      - api-key-rotate
      - api-key-last-rotated
      - POST /api-keys/:id/rotate
      - '{"error":"unauthorized"}'
      - 'Authorization: Bearer'

  - id: migration-present
    kind: artifact-exists
    path: src/db/migrations/0004_*.sql

  - id: rotate-migration
    kind: artifact-exists
    path: src/db/migrations/0005_*.sql

  - id: drift
    kind: command
    run: gatekit drift --feature F1

  - id: smoke
    kind: e2e
    run: make smoke
    timeout: 900

  - id: unit-tests
    kind: test
    run: make test-docker
    timeout: 900

  - id: authenticate-present
    kind: artifact-exists
    path: src/http/middleware/authenticate.ts
